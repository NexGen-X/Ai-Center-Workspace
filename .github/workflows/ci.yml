name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Build & Test Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: routex
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: ai_center
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Configure Git Identity for Tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build All Workspaces
        run: npm run build

      - name: Execute Server Test Suite
        env:
          PORT: 3000
          NODE_ENV: test
          DATABASE_URL: postgres://routex:testpassword123@127.0.0.1:5432/ai_center?sslmode=disable
          ENCRYPTION_KEY: test-encryption-key-32-chars-2026!
        run: npm test
