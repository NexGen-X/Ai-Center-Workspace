name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build & Test Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: routex
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: ai_center
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd server && npm ci || npm install
          cd ../client && npm ci || npm install

      - name: Build Backend (TypeScript)
        run: |
          cd server
          npm run build

      - name: Build Frontend (Vite & React)
        run: |
          cd client
          npm run build

      - name: Execute Server Test Suite
        env:
          PORT: 3000
          NODE_ENV: test
          DATABASE_URL: postgres://routex:testpassword123@127.0.0.1:5432/ai_center?sslmode=disable
          ENCRYPTION_KEY: test-encryption-key-32-chars-2026!
        run: |
          cd server
          npm test
